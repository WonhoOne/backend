spring:
  datasource:
    url: jdbc:h2:mem:misterworld;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Deterministic test-only key; never use this profile/key outside tests.
security:
  jwt:
    secret: test-only-key-for-auth-tests-at-least-32-bytes
    expires-in-seconds: 3600
employee:
  bootstrap:
    enabled: false

# Tests never enable paid delivery through inherited environment variables.
sms:
  delivery:
    enabled: false
