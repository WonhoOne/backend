# Local demo ONLY. These credentials are disposable and unsuitable for deployment.
name: misterworld-b9-demo
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: misterworld_demo
      MYSQL_USER: misterworld_demo
      MYSQL_PASSWORD: b9-demo-local-only-password
      MYSQL_ROOT_PASSWORD: b9-demo-local-only-root-password
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - demo-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 36
volumes:
  demo-data:
